<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>📝 To-Do List</h1>
        <p>Organize your daily tasks efficiently</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Add Task Section -->
        <section class="todo-container">

            <h2>Add a New Task</h2>
            <div class="input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                >
                <button id="addTaskBtn">
                    Add Task
                </button>
            </div>
        </section>

        <!-- Task Counter -->
        <section class="task-summary">

            <div class="summary-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="summary-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="summary-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>

        <!-- Task List -->
        <section class="task-list-section">
            <h2>My Tasks</h2>
            <ul id="taskList">
                <!-- Tasks will be added here dynamically -->
            </ul>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 To-Do List App</p>
        <p>Built using HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
